services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Required. Fails fast if SECRET_KEY is not exported on the host
      # (or defined in a local .env file next to this compose file).
      - LEARN2MASTER_SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      # For a real deployment, point this at a managed Postgres/Supabase
      # instance so data persists outside the container, e.g.:
      #   DATABASE_URL=postgresql://user:pass@host:5432/dbname
      - DATABASE_URL=${DATABASE_URL:-}
      - FLASK_APP=app.py
    volumes:
      - ./logs:/app/logs
    restart: always
