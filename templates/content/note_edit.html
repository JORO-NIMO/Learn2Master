{% extends "layouts/base.html" %}
{% block title %}Edit Adaptive Note{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/learning.css') }}">
{% endblock %}

{% block content %}

<section class="hero-panel">
  <div>
    <p class="eyebrow">Teacher Content Management</p>
    <h1>Edit Adaptive Note</h1>
    <p>Update the details for <strong>{{ note.note_title }}</strong>.</p>
  </div>
  <div class="hero-badge">
    <span>Edit</span>
    <strong>Note</strong>
  </div>
</section>

<section class="learn-card">
  <form method="POST"
        action="{{ url_for('content.edit_note', note_id=note.note_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-row">
      <div class="form-group">
        <label for="outcome_id">Learning Outcome</label>
        <select id="outcome_id" name="outcome_id" required>
          <option value="">— Select outcome —</option>
          {% for o in outcomes %}
          <option value="{{ o.outcome_id }}"
            {% if o.outcome_id == note.outcome_id %}selected{% endif %}>
            {{ o.outcome_code }} — {{ o.outcome_name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="concept_tag">Concept Tag</label>
        <input type="text" id="concept_tag" name="concept_tag"
               value="{{ note.concept_tag }}" maxlength="100" required>
      </div>

      <div class="form-group">
        <label for="priority">Priority</label>
        <input type="number" id="priority" name="priority"
               value="{{ note.priority }}" min="1" required>
      </div>
    </div>

    <div class="form-group">
      <label for="note_title">Note Title</label>
      <input type="text" id="note_title" name="note_title"
             value="{{ note.note_title }}" maxlength="255" required>
    </div>

    <div class="form-group">
      <label for="note_body">Note Body</label>
      <textarea id="note_body" name="note_body"
                rows="8" required>{{ note.note_body }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('content.list_notes') }}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
