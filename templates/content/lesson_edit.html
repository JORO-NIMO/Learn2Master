{% extends "layouts/base.html" %}
{% block title %}Edit Lesson{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/learning.css') }}">
{% endblock %}

{% block content %}

<section class="hero-panel">
  <div>
    <p class="eyebrow">Teacher Content Management</p>
    <h1>Edit Lesson</h1>
    <p>Update the details for <strong>{{ lesson.lesson_title }}</strong>.</p>
  </div>
  <div class="hero-badge">
    <span>Edit</span>
    <strong>Lesson</strong>
  </div>
</section>

<section class="learn-card">
  <form method="POST"
        action="{{ url_for('content.edit_lesson', lesson_id=lesson.lesson_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-row">
      <div class="form-group">
        <label for="course_id">Course</label>
        <select id="course_id" name="course_id" required>
          <option value="">— Select course —</option>
          {% for c in courses %}
          <option value="{{ c.course_id }}"
            {% if c.course_id == lesson.course_id %}selected{% endif %}>
            {{ c.course_title }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="outcome_id">Learning Outcome</label>
        <select id="outcome_id" name="outcome_id" required>
          <option value="">— Select outcome —</option>
          {% for o in outcomes %}
          <option value="{{ o.outcome_id }}"
            {% if o.outcome_id == lesson.outcome_id %}selected{% endif %}>
            {{ o.outcome_code }} — {{ o.outcome_name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="sequence_order">Sequence Order</label>
        <input type="number" id="sequence_order" name="sequence_order"
               value="{{ lesson.sequence_order }}" min="1" required>
      </div>

      <div class="form-group">
        <label for="estimated_minutes">Est. Minutes <span style="font-weight:400">(optional)</span></label>
        <input type="number" id="estimated_minutes" name="estimated_minutes"
               value="{{ lesson.estimated_minutes if lesson.estimated_minutes else '' }}" min="1">
      </div>
    </div>

    <div class="form-group">
      <label for="lesson_title">Lesson Title</label>
      <input type="text" id="lesson_title" name="lesson_title"
             value="{{ lesson.lesson_title }}" maxlength="255" required>
    </div>

    <div class="form-group">
      <label for="video_url">Video URL <span style="font-weight:400">(optional)</span></label>
      <input type="url" id="video_url" name="video_url"
             value="{{ lesson.video_url if lesson.video_url else '' }}"
             placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <div class="form-group">
      <label for="lesson_content">Lesson Content <span style="font-weight:400">(optional)</span></label>
      <textarea id="lesson_content" name="lesson_content"
                rows="6">{{ lesson.lesson_content if lesson.lesson_content else '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('content.list_lessons') }}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
