{% extends "layouts/base.html" %}
{% block title %}Edit Competency{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/learning.css') }}">
{% endblock %}

{% block content %}

<section class="hero-panel">
  <div>
    <p class="eyebrow">Admin — Curriculum</p>
    <h1>Edit Competency</h1>
    <p>Update details for <strong>{{ competency.competency_code }}</strong>.</p>
  </div>
  <div class="hero-badge">
    <span>Edit</span>
    <strong>{{ competency.competency_code }}</strong>
  </div>
</section>

<section class="learn-card">
  <form method="POST"
        action="{{ url_for('content.admin_edit_competency', competency_id=competency.competency_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-row">
      <div class="form-group">
        <label for="subject_id">Subject</label>
        <select id="subject_id" name="subject_id" required>
          <option value="">— Select subject —</option>
          {% for s in subjects %}
          <option value="{{ s.subject_id }}"
            {% if s.subject_id == competency.subject_id %}selected{% endif %}>
            {{ s.subject_name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="competency_code">Competency Code</label>
        <input type="text" id="competency_code" name="competency_code"
               value="{{ competency.competency_code }}" maxlength="50" required>
      </div>
    </div>

    <div class="form-group">
      <label for="competency_name">Competency Name</label>
      <input type="text" id="competency_name" name="competency_name"
             value="{{ competency.competency_name }}" maxlength="255" required>
    </div>

    <div class="form-group">
      <label for="competency_description">Description <small>(optional)</small></label>
      <textarea id="competency_description" name="competency_description"
                rows="4">{{ competency.competency_description or '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('content.admin_curriculum') }}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</section>

{% endblock %}
